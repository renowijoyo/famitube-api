name: Deploy FamiTube API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to famitube-api.gamantha.my.id via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/html/famitube-api
            sudo -H -u www-data git pull origin main
            sudo -H -u www-data npm ci
            sudo -H -u www-data npm run build
            sudo systemctl restart famitube-api.service
